[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono"] }
tokio = { version = "1.53.2", features = ["full"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum", "vendored"] }
validator = "0.20"
[profile.release]
opt-level = "s"
strip = true
lto = "thin"
codegen-units = 1